app = 'cadia-dicom-scp'
primary_region = 'gru'
kill_signal = 'SIGTERM'
kill_timeout = '5m'

[deploy]
  strategy = 'bluegreen'

[build]

[env]
  SCP_AE_TITLE = 'CADIA.PE'
  SCP_PORT = '11112'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "10s"

[[services]]
  protocol = 'tcp'
  internal_port = 11112

  [[services.ports]]
    port = 104

  [[services.ports]]
    port = 11112

  [services.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 80

[[vm]]
  cpu_kind = 'performance'
  cpus = 2
  memory = '2gb'
  memory_mb = 2048